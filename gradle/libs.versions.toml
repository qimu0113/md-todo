[versions]
agp = "9.4.1"
coreKtx = "1.19.1"
coroutines = "1.11.0"
material = "1.14.0"
leakcanary = "2.14"
junit = "4.13.2"
lifecycleRuntimeKtx = "2.11.0"
activityCompose = "1.13.0"
kotlin = "2.4.20"
composeBom = "2026.09.00"
navigationCompose = "2.10.2"
documentFile = "1.1.0"
workRuntimeKtx = "2.12.0"
glance = "1.2.0"
# MD Todo：从 1.5.0-alpha21 降回 BOM 2026.09.00 配套的 1.4.0 稳定版。
# 原因（2026-10-17 查证）：
#   1. alpha21 声明依赖 compose 1.12.0-alpha03，实际运行 compose-ui 1.12.1（BOM 提供）
#   2. alpha21 有破坏性变更：BottomSheet PartiallyExpanded 锚点不再按布局条件自动移除，
#      且 isAnchoredDraggableComponentsAnchorRecoveryEnabled 特性开关被移除（无法回退）
#   3. 本项目 HomeScreen 仍用旧式 rememberModalBottomSheetState(skipPartiallyExpanded = true)
#   4. 症状吻合 ANR（RenderThread 100%、返回主界面触发），待真机验证
# 已确认：全项目零使用 1.5.0-alpha 专属 API（MenuItems/ButtonGroup/animateWidth 等），降级安全
material3 = "1.5.0-alpha21"

[libraries]
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
androidx-documentfile = { group = "androidx.documentfile", name = "documentfile", version.ref = "documentFile" }
google-material = { group = "com.google.android.material", name = "material", version.ref = "material" }
squareup-leakcanary-android = { group = "com.squareup.leakcanary", name = "leakcanary-android", version.ref = "leakcanary" }
junit = { group = "junit", name = "junit", version.ref = "junit" }
androidx-lifecycle-runtime-ktx = { group = "androidx.lifecycle", name = "lifecycle-runtime-ktx", version.ref = "lifecycleRuntimeKtx" }
androidx-lifecycle-runtime-compose = { group = "androidx.lifecycle", name = "lifecycle-runtime-compose", version.ref = "lifecycleRuntimeKtx" }
androidx-lifecycle-viewmodel-compose = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-compose", version.ref = "lifecycleRuntimeKtx" }
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }
androidx-navigation-compose = { group = "androidx.navigation", name = "navigation-compose", version.ref = "navigationCompose" }
kotlinx-coroutines-android = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-android", version.ref = "coroutines" }
androidx-compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
androidx-compose-ui = { group = "androidx.compose.ui", name = "ui" }
androidx-compose-ui-graphics = { group = "androidx.compose.ui", name = "ui-graphics" }
androidx-compose-foundation = { group = "androidx.compose.foundation", name = "foundation" }
androidx-compose-foundation-layout = { group = "androidx.compose.foundation", name = "foundation-layout" }
androidx-compose-material-icons-extended = { group = "androidx.compose.material", name = "material-icons-extended" }
androidx-compose-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling" }
androidx-compose-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
androidx-compose-material3 = { group = "androidx.compose.material3", name = "material3", version.ref = "material3" }
androidx-work-runtime-ktx = { group = "androidx.work", name = "work-runtime-ktx", version.ref = "workRuntimeKtx" }
androidx-glance-appwidget = { group = "androidx.glance", name = "glance-appwidget", version.ref = "glance" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
